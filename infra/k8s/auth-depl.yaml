apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-depl

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth

  template:
    metadata:
      labels:
        app: auth

    spec:
      containers:
        - name: auth
          image: ayushpatil0810/auth:latest
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: JWT_SECRET
            - name: NODE_ENV
              value: production
          # ─── Health probes ──────────────────────────────────────────────────
          # The /health endpoint returns 200 once the HTTP server is up.
          # Liveness: restart the pod if the server is completely unresponsive.
          # Readiness: stop routing traffic during startup or graceful shutdown.
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: auth-srv

spec:
  type: ClusterIP
  selector:
    app: auth

  ports:
    - name: auth
      protocol: TCP
      port: 3000
      targetPort: 3000
